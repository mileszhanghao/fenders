name: Pipeline

# Daily: pull new data into the lake (the `lake` branch), rebuild the warehouse
# with dbt, run the data tests, and publish the dashboard.
on:
  schedule:
    - cron: "17 14 * * *" # 07:17 Seattle time (PDT)
  workflow_dispatch:
    inputs:
      full:
        description: Reload everything from the sources
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out the lake
        run: |
          if git ls-remote --exit-code --heads origin lake >/dev/null; then
            git fetch --depth 1 origin lake:refs/remotes/origin/lake
            git worktree add lake origin/lake
          else
            git worktree add --orphan -b lake lake
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Extract
        run: python -m fenders.extract --lake lake ${{ inputs.full && '--full' || '' }}
      - name: Save the lake
        run: |
          set -e
          cd lake
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -qm "Load $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:lake
          fi
      - name: Transform and test (dbt)
        working-directory: transform
        env:
          FENDERS_LAKE: ../lake
          FENDERS_DB: fenders.duckdb
        run: |
          dbt build --profiles-dir .
          dbt docs generate --profiles-dir . --static
      - name: Export dashboard data
        run: |
          python -m fenders.export --db transform/fenders.duckdb --lake lake --out site/data
          python -m fenders.tableau --db transform/fenders.duckdb --out site/data/tableau
          mkdir -p site/dbt && cp transform/target/static_index.html site/dbt/index.html
      # Optional: also publish to S3 once infra/ is applied and the two repository
      # variables are set. Credentials are short-lived (GitHub OIDC), nothing is stored.
      - name: AWS credentials
        if: ${{ vars.FENDERS_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
      - name: Publish to S3
        if: ${{ vars.FENDERS_BUCKET != '' }}
        run: |
          pip install -e '.[aws]'
          python -m fenders.publish_s3 --db transform/fenders.duckdb --site site/data --bucket "${{ vars.FENDERS_BUCKET }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: run
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
