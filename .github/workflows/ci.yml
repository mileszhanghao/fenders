name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (extract with mocked HTTP; dbt models on a fixture lake)
        run: pytest -v
      - name: dbt parse
        working-directory: transform
        run: dbt parse --profiles-dir .

  airflow:
    # The Airflow DAG: loads, has the right shape, runs end to end on the fixture lake,
    # and stops before publishing when a data test fails.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install "apache-airflow==3.1.8" \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.1.8/constraints-3.12.txt
          pip install -e '.[dev]'
      - run: pytest -v tests/test_airflow_dag.py
