name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (extract with mocked HTTP; dbt models on a fixture lake)
        run: pytest -v
      - name: dbt parse
        working-directory: transform
        run: dbt parse --profiles-dir .
